apiVersion: v1
kind: Namespace
metadata:
  name: jarvis-training
  labels:
    app.kubernetes.io/part-of: jarvis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-pvc
  namespace: jarvis-training
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
  namespace: jarvis-training
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs-pvc
  namespace: jarvis-training
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: jarvis-training-priority
value: 1000
globalDefault: false
description: "High priority for moderation training jobs"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: finetune-job
  namespace: jarvis-training
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      priorityClassName: jarvis-training-priority
      containers:
      - name: trainer
        image: jarvis/trainer:axolotl
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -lc
        - |
          set -euo pipefail
          LOG_DIR="/logs/finetune-job"
          mkdir -p "$LOG_DIR"
          SCRIPT_PATH="/app/scripts/train.py"
          if [ ! -f "$SCRIPT_PATH" ] && [ -f "/workspace/scripts/train.py" ]; then
            SCRIPT_PATH="/workspace/scripts/train.py"
          fi
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "train.py not found in container (/app/scripts or /workspace/scripts)" >&2
            exit 1
          fi

          # Unbuffered stdout + persistent logs on PVC.
          python -u "$SCRIPT_PATH" \
            --train-file /data/dataset/train.jsonl \
            --eval-file /data/dataset/eval.jsonl \
            --output-dir /models/jarvis-moderation-ft \
            --logs-dir "$LOG_DIR" \
            --batch-size 1 \
            --gradient-accumulation-steps 4 \
            --logging-steps 1 \
            2>&1 | tee "$LOG_DIR/stdout.log"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "3Gi"
            cpu: "2"
        env:
        - name: MODEL_ID
          value: distilbert-base-uncased
        - name: TRANSFORMERS_NO_ADVISORY_WARNINGS
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: BATCH_SIZE
          value: "1"
        volumeMounts:
        - name: training-data
          mountPath: /data
        - name: model-output
          mountPath: /models
        - name: logs
          mountPath: /logs
        - name: training-scripts
          mountPath: /workspace/scripts/train.py
          subPath: train.py
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: training-pvc
      - name: model-output
        persistentVolumeClaim:
          claimName: model-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: logs-pvc
      - name: training-scripts
        configMap:
          name: training-scripts
