  namespace: jarvis-data
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jarvis-data
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: jarvis-data
spec:
  selector:
    app: chromadb
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-backend
  namespace: jarvis-llm
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-api
  namespace: jarvis-core
spec:
  selector:
    app: jarvis-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: websocket
    port: 8081
    targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-ingress
  namespace: jarvis-core
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/websocket-services: jarvis-api
spec:
  ingressClassName: nginx
  rules:
  - host: jarvis.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jarvis-api
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: jarvis-api
            port:
              number: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-access-policy
  namespace: jarvis-data
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/part-of: jarvis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: training-isolation
  namespace: jarvis-training
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: jarvis-data
    ports:
    - port: 5432
  - ports:
    - port: 53
      protocol: UDP
