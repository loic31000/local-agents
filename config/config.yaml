# -----------------------------------------------------------------------------
# Outils
# -----------------------------------------------------------------------------


tools:
  filesystem:
    name: "Filesystem"
    description: "Lecture/écriture de fichiers"
    handler: "internal/tools/filesystem.go"

  terminal:
    name: "Terminal"
    description: "Exécution de commandes shell"
    handler: "internal/tools/terminal.go"
    config:
      allowed_commands: [ls, cat, head, tail, grep, find, wc, pwd, echo]
      denied_commands:  [rm, sudo, chmod, chown, dd, mkfs]
      timeout_ms: 30000

  git:
    name: "Git"
    description: "Opérations Git"
    handler: "internal/tools/git.go"

  vscode:
    name: "VSCode"
    description: "Intégration Visual Studio Code"
    handler: "internal/tools/vscode.go"

  smtp:
    name: "SMTP"
    description: "Envoi d'emails"
    handler: "internal/tools/email.go"

  twitter:
    name: "Twitter"
    description: "Publication sur Twitter/X"
    handler: "internal/tools/twitter.go"

  linkedin:
    name: "LinkedIn"
    description: "Publication sur LinkedIn"
    handler: "internal/tools/linkedin.go"
