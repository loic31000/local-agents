server:
    host: 0.0.0.0
    port: 8081
    websocket_path: /ws
ollama:
    base_url: http://host.docker.internal:11434
    default_model: llama3.2:latest
    models:
        coding: qwen2.5-coder:1.5b
        fast: smollm2:360m
        french: mistral:7b-instruct-q4_0
        general: llama3.2:latest
agents:
    coder:
        enabled: true
        prompt_file: prompts/coder.md
        model: phi4-mini:latest
        tools:
            - vscode
            - git
            - terminal
            - filesystem
        port: 0
        endpoint: ""
        type: ""
    cyberdefence:
        enabled: true
        prompt_file: prompts/cyberdefence.md
        model: ""
        tools: []
        port: 8086
        endpoint: http://localhost:8086
        type: external
    discord:
        enabled: true
        prompt_file: prompts/discord.md
        model: fast
        tools: []
        port: 0
        endpoint: python://agents/discord/bot.py
        type: external
    email:
        enabled: true
        prompt_file: prompts/email.md
        model: fast
        tools:
            - smtp
        port: 0
        endpoint: ""
        type: ""
    files:
        enabled: true
        prompt_file: prompts/files.md
        model: general
        tools:
            - filesystem
        port: 0
        endpoint: ""
        type: ""
    social:
        enabled: false
        prompt_file: prompts/social.md
        model: general
        tools:
            - twitter
            - linkedin
        port: 0
        endpoint: ""
        type: ""
storage:
    type: ""
    path: ""
logging:
    level: ${LOG_LEVEL:-info}
    format: json
    file: logs/agents.log
queue:
    type: memory
    max_concurrent: 5
    task_timeout: 5m
