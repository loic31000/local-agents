services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-agents-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    build:
      context: ..
      dockerfile: config/Dockerfile.orchestrator
    container_name: local-agents-orchestrator
    ports:
      - "8081:8081"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ../config/config.docker.yaml:/root/config.yaml:ro
      - ../web:/root/web:ro
      - ../prompts:/root/prompts:ro
    env_file:
      - ../.env
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  agents:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
    container_name: local-agents-python
    depends_on:
      ollama:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - ORCHESTRATOR_URL=http://orchestrator:8081
      - OLLAMA_MODEL=llama3.2:latest
    volumes:
      - ../agents:/app/agents:ro
      - ../config/config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped

  cyberdefence:
    build:
      context: ..
      dockerfile: config/Dockerfile.agents
    container_name: local-agents-cyberdefence
    command: ["python", "-m", "agents.cyberdefence.agent"]
    ports:
      - "8086:8086"
    depends_on:
      orchestrator:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8081
    volumes:
      - ../agents:/app/agents:ro
      - ../config/config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
    driver: local