# =============================================================================
# Configuration des Agents - Local Agents
# =============================================================================
# Ce fichier permet de définir des agents custom SANS modifier le code Go.
# L'orchestrateur charge automatiquement les agents définis ici au démarrage.
# =============================================================================

# -----------------------------------------------------------------------------
# Agents intégrés (built-in)
# -----------------------------------------------------------------------------

agents:
  # Agent Coder - Génération de code
  coder:
    enabled: true
    name: "Coder"
    description: "Agent spécialisé dans la génération et l'analyse de code"
    icon: "💻"
    
    # Modèle à utiliser (référence ollama.models ou nom direct)
    model: "coding"  # Utilise ollama.models.coding
    
    # Fichier de prompt système (relatif à ./prompts/)
    prompt_file: "prompts/coder.md"
    # Outils disponibles pour cet agent
    tools:
      - vscode
      - git
      - terminal
      - filesystem
    
    # Configuration spécifique
    config:
      temperature: 0.3      # Plus déterministe pour le code
      max_tokens: 2048
      timeout_ms: 120000    # 2 minutes pour génération longue
    
    # Capacités déclarées
    capabilities:
      - code_generation
      - code_review
      - debugging
      - refactoring

  # Agent Files - Gestion de fichiers
  files:
    enabled: true
    name: "Files"
    description: "Agent de gestion de fichiers et dossiers"
    icon: "📁"
    model: "general"
    prompt_file: "prompts/files.md"
    tools:
      - filesystem
    config:
      temperature: 0.2
      max_tokens: 1024
    capabilities:
      - file_read
      - file_write
      - file_search
    
    # Restrictions de sécurité
    security:
      allowed_paths:
        - "${HOME}/Documents"
        - "${HOME}/Projects"
        - "${HOME}/Downloads"
      denied_paths:
        - "${HOME}/.ssh"
        - "${HOME}/.gnupg"
        - "/etc"
        - "/var"
      max_file_size_mb: 10

  # Agent Email
  email:
    enabled: true
    name: "Email"
    description: "Agent d'envoi et gestion d'emails"
    icon: "✉️"
    model: "general"
    prompt_file: "prompts/email.md"
    tools:
      - smtp
    config:
      temperature: 0.5
      max_tokens: 1024
    capabilities:
      - send_email
      - draft_email
    
    # Configuration SMTP (override depuis .env)
    smtp:
      host: "${EMAIL_SMTP_HOST:-smtp.gmail.com}"
      port: "${EMAIL_SMTP_PORT:-587}"
      user: "${EMAIL_USER}"
      password: "${EMAIL_PASS}"

  # Agent Social
  social:
    enabled: false  # Désactivé par défaut
    name: "Social"
    description: "Agent de publication sur réseaux sociaux"
    icon: "🐦"
    model: "general"
    prompt_file: "prompts/social.md"
    tools:
      - twitter
      - linkedin
    config:
      temperature: 0.7
      max_tokens: 512
    capabilities:
      - post_twitter
      - post_linkedin

  # Agent Discord
  discord:
    enabled: true
    name: "Discord"
    description: "Bot Discord Jarvis"
    icon: "🎮"
    model: "fast"
    prompt_file: "prompts/discord.md"
    
    # Le bot Discord est un agent externe (Python)
    type: "external"
    endpoint: "python://agents/discord/bot.py"
    
    config:
      temperature: 0.6
      max_tokens: 1024
      timeout_ms: 90000
    
    capabilities:
      - chat
      - moderation
      - role_management
    
    # Modes disponibles (spécifique Discord)
    modes:
      discussion:
        prompt_file: "discord_discussion.md"
        model: "general"
        temperature: 0.7
      code:
        prompt_file: "discord_code.md"
        model: "coding"
        temperature: 0.3
      moderation:
        prompt_file: "discord_moderation.md"
        model: "fast"
        temperature: 0.2

