# -----------------------------------------------------------------------------
# Modèles Ollama
# -----------------------------------------------------------------------------

ollama:
  base_url: "http://localhost:11434"
  default_model: "llama3.2:3b"
  
  # Alias de modèles
  models:
    coding: "llama3.2:3b"      # Pour génération de code
    general: "llama3.2:3b"     # Usage général
    fast: "phi3:mini"          # Réponses rapides
    french: "mistral:7b"       # Meilleur pour le français
    
  # Configuration par défaut
  defaults:
    temperature: 0.7
    max_tokens: 1024
    timeout_ms: 60000

# -----------------------------------------------------------------------------
# Serveur
# -----------------------------------------------------------------------------

server:
  host: "0.0.0.0"
  port: 8080
  websocket_path: "/ws"
  
  # CORS
  cors:
    enabled: true
    origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

logging:
  level: "${LOG_LEVEL:-info}"  # debug, info, warn, error
  format: "json"               # json ou text
  file: "logs/agents.log"
  
  # Logs structurés - champs inclus
  fields:
    - timestamp
    - level
    - request_id
    - agent_id
    - duration_ms
    - status

# -----------------------------------------------------------------------------
# Queue de tâches
# -----------------------------------------------------------------------------

queue:
  type: "memory"          # memory ou redis
  max_concurrent: 5
  task_timeout: "5m"
  retry_attempts: 3
  retry_delay: "1s"
