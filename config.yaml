server:
  host: "127.0.0.1"
  port: 8081
  websocket_path: "/ws"

ollama:
  base_url: "http://localhost:11434"
  default_model: "llama3.2:latest"
  models:
    coding: "qwen2.5-coder:1.5b"
    general: "llama3.2:latest"
    fast: "smollm2:360m"
    french: "mistral:7b-instruct-q4_0"

logging:
  level: "info"
  format: "json"
  file: "logs/test-agents.log"

agents:
  test-agent:
    enabled: true
    prompt_file: "prompts/coder.md"
    model: "coding"
    tools:
      - "filesystem"
      - "terminal"
    port: 8082
    endpoint: "http://localhost:8082"
    type: "internal"