services:

  # ── Ollama — LLM backend ────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: local-agents-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Décommenter pour NVIDIA GPU :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Orchestrateur Go ────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: local-agents-orchestrator
    ports:
      - "8081:8081"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./config.docker.yaml:/root/config.yaml:ro
      - ./web:/root/web:ro
      - ./prompts:/root/prompts:ro
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Agents Python ───────────────────────────────────────────────────────────
  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    container_name: local-agents-python
    depends_on:
      ollama:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - ORCHESTRATOR_URL=http://orchestrator:8081
    volumes:
      - ./agents:/app/agents:ro
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped

  # ── CyberDefence ────────────────────────────────────────────────────────────
  cyberdefence:
    build:
      context: .
      dockerfile: Dockerfile.agents
    container_name: local-agents-cyberdefence
    command: ["python", "-m", "agents.cyberdefence.agent"]
    ports:
      - "8086:8086"
    depends_on:
      orchestrator:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8081
    volumes:
      - ./agents:/app/agents:ro
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
    driver: local