<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Agents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
        }
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .message {
            margin-bottom: 1rem;
        }
        .message.user {
            text-align: right;
        }
        .message.assistant {
            text-align: left;
        }
        .modal {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-white">
    <!-- Header -->
    <div class="border-b border-white/10 bg-black/20 backdrop-blur-sm">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <h1 class="text-xl font-bold">Local Agents</h1>
                    <div id="connection-status" class="flex items-center gap-2 text-sm">
                        <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        <span class="text-gray-400">Déconnecté</span>
                    </div>
                    <div id="ollama-status" class="flex items-center gap-2 text-sm">
                        <span class="w-2 h-2 rounded-full bg-gray-500"></span>
                        <span class="text-gray-400">Ollama: vérification...</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="current-agent-name" class="text-sm text-gray-400">Aucun agent</span>
                    <span class="text-gray-500">•</span>
                    <span id="current-agent-model" class="text-sm text-gray-400">default</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto px-4 py-6">
        <div class="grid grid-cols-12 gap-6">
            <!-- Sidebar -->
            <div class="col-span-3">
                <div class="bg-white/5 rounded-lg p-4">
                    <h2 class="text-sm font-semibold mb-4 text-gray-300">Agents Disponibles</h2>
                    <div id="agents-list" class="space-y-2">
                        <!-- Agents will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Main Panel -->
            <div class="col-span-9">
                <!-- Tabs -->
                <div class="flex gap-1 mb-6 bg-white/5 rounded-lg p-1">
                    <button id="tab-chat" class="tab-btn active flex-1 py-2 px-4 rounded-md text-sm font-medium transition" onclick="switchTab('chat')">
                        💬 Chat
                    </button>
                    <button id="tab-settings" class="tab-btn flex-1 py-2 px-4 rounded-md text-sm font-medium transition" onclick="switchTab('settings')">
                        ⚙️ Paramètres
                    </button>
                </div>

                <!-- Chat Panel -->
                <div id="panel-chat" class="space-y-4">
                    <!-- Messages -->
                    <div id="messages" class="bg-white/5 rounded-lg p-4 h-96 overflow-y-auto">
                        <!-- Messages will appear here -->
                    </div>

                    <!-- Input Form -->
                    <form id="chat-form" class="flex gap-2" onsubmit="handleSubmit(event)">
                        <div class="flex-1 relative">
                            <textarea
                                id="message-input"
                                placeholder="Tapez votre message..."
                                class="w-full bg-white/5 rounded-lg px-4 py-3 pr-12 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                rows="1"
                            ></textarea>
                            <button
                                id="stop-btn"
                                type="button"
                                onclick="stopGeneration()"
                                class="absolute right-2 top-2 p-1.5 hover:bg-red-500/20 rounded text-red-400 transition hidden"
                                title="Arrêter la génération"
                            >
                                <i data-lucide="square" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <button
                            type="submit"
                            class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium transition flex items-center gap-2"
                        >
                            <i data-lucide="send" class="w-4 h-4"></i>
                            Envoyer
                        </button>
                    </form>
                </div>

                <!-- Settings Panel -->
                <div id="panel-settings" class="space-y-6 hidden">
                    <!-- Models Section -->
                    <div class="bg-white/5 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-semibold">Modèles Ollama</h2>
                            <div class="flex gap-2">
                                <button onclick="loadModels()" class="px-3 py-1.5 bg-blue-500/20 hover:bg-blue-500/30 rounded text-blue-400 transition text-sm">
                                    <i data-lucide="refresh-ccw" class="w-4 h-4 inline mr-1"></i>
                                    Actualiser
                                </button>
                                <button onclick="openModal('modal-download')" class="px-3 py-1.5 bg-green-500/20 hover:bg-green-500/30 rounded text-green-400 transition text-sm">
                                    <i data-lucide="plus" class="w-4 h-4 inline mr-1"></i>
                                    Télécharger
                                </button>
                            </div>
                        </div>
                        <div id="models-list" class="space-y-2">
                            <!-- Models will be loaded here -->
                        </div>
                    </div>

                    <h2 class="text-xs font-semibold text-gray-500 uppercase mb-3">Configuration par Agent</h2>
                    <div id="agent-models-config" class="space-y-3 mb-4 bg-white/5 rounded-lg p-4">
                        <!-- Agent model configuration -->
                    </div>

                    <!-- Global Settings -->
                    <div class="bg-white/5 rounded-lg p-6">
                        <h2 class="text-lg font-semibold mb-4">Paramètres Globaux</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-sm text-gray-400 block mb-2">URL Ollama</label>
                                <input
                                    id="ollama-url-input"
                                    type="text"
                                    value="http://localhost:11434"
                                    class="w-full bg-[#252525] rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                >
                            </div>
                            <div>
                                <label class="text-sm text-gray-400 block mb-2">Modèle par défaut</label>
                                <select id="default-model-select" class="w-full bg-[#252525] rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    <option value="default">Par défaut</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-sm text-gray-400 block mb-2">Timeout génération (sec)</label>
                                <input
                                    id="generation-timeout"
                                    type="number"
                                    value="120"
                                    min="10"
                                    max="600"
                                    class="w-full bg-[#252525] rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                >
                            </div>
                            <div>
                                <label class="text-sm text-gray-400 block mb-2">Max tokens par réponse</label>
                                <input
                                    id="max-tokens"
                                    type="number"
                                    value="2048"
                                    min="128"
                                    max="8192"
                                    class="w-full bg-[#252525] rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                >
                            </div>
                            <div class="col-span-2">
                                <label class="text-sm text-gray-400 block mb-2">Température (0.0 - 2.0)</label>
                                <input
                                    id="temperature"
                                    type="number"
                                    value="0.7"
                                    min="0"
                                    max="2"
                                    step="0.1"
                                    class="w-full bg-[#252525] rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                >
                            </div>
                        </div>
                        <div class="mt-6 flex justify-end">
                            <button onclick="saveSettings()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-lg font-medium transition">
                                Sauvegarder
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Download Modal -->
    <div id="modal-download" class="modal fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-[#1a1a1a] rounded-lg p-6 w-full max-w-md">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">Télécharger un modèle</h3>
                <button onclick="closeModal('modal-download')" class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-gray-400 block mb-2">Nom du modèle</label>
                    <input
                        id="model-name-input"
                        type="text"
                        placeholder="ex: llama2:7b, codellama:13b"
                        class="w-full bg-[#252525] rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    >
                </div>
                <div id="download-progress" class="hidden space-y-2">
                    <div class="flex justify-between text-sm">
                        <span id="download-status">Préparation...</span>
                        <span id="download-percent">0%</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2">
                        <div id="download-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button onclick="closeModal('modal-download')" class="px-4 py-2 text-gray-400 hover:text-white transition">
                        Annuler
                    </button>
                    <button id="download-btn" onclick="startDownload()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded transition">
                        Télécharger
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Model Selector Modal -->
    <div id="modal-model-selector" class="modal fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-[#1a1a1a] rounded-lg p-6 w-full max-w-md max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">Sélectionner un modèle</h3>
                <button onclick="closeModal('modal-model-selector')" class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="model-selector-list" class="space-y-2">
                <!-- Models will be listed here -->
            </div>
        </div>
    </div>

    <script>
        // State
        let currentAgent = 'coder';
        let agents = [];
        let models = [];
        let ws = null;
        let isConnected = false;
        let isGenerating = false;
        let currentTab = 'chat';

        // Agent icons mapping
        const agentIcons = {
            coder: 'code-2',
            files: 'folder',
            email: 'mail',
            social: 'share-2',
            discord: 'message-circle'
        };

        const agentColors = {
            coder: 'indigo',
            files: 'orange',
            email: 'blue',
            social: 'pink',
            discord: 'purple'
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadAgents();
            loadModels();
            loadSettings();
            connectWebSocket();
            checkOllamaStatus();

            document.getElementById('chat-form').addEventListener('submit', handleSubmit);

            // Auto-resize textarea
            const textarea = document.getElementById('message-input');
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            });

            // Check Ollama status periodically
            setInterval(checkOllamaStatus, 30000);
        });

        // Tab switching
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            document.getElementById('panel-chat').classList.toggle('hidden', tab !== 'chat');
            document.getElementById('panel-settings').classList.toggle('hidden', tab !== 'settings');

            if (tab === 'settings') {
                loadModels();
            }
        }

        // Load models from Ollama
        async function loadModels() {
            try {
                const response = await fetch('/api/ollama/models');
                const data = await response.json();
                models = data.models || [];
                renderModelsList();
                renderAgentModelsConfig(); // Re-render agent config with loaded models
            } catch (error) {
                console.error('Error loading models:', error);
                // Try direct Ollama API
                try {
                    const response = await fetch('http://localhost:11434/api/tags');
                    const data = await response.json();
                    models = data.models || [];
                    renderModelsList();
                    renderAgentModelsConfig(); // Re-render agent config with loaded models
                } catch (e) {
                    console.error('Direct Ollama fetch failed:', e);
                }
            }
        }

        // Render models list
        function renderModelsList() {
            const container = document.getElementById('models-list');
            if (!container) return;

            if (models.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500 text-sm">
                        <i data-lucide="package" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <div>Aucun modèle installé</div>
                        <div class="text-xs mt-1">Télécharge un modèle pour commencer</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = models.map(model => {
                const size = model.size ? formatBytes(model.size) : 'N/A';
                const isActive = model.name === getCurrentAgentModel();
                const statusIcon = isActive ? 'check-circle' : 'circle';
                const statusColor = isActive ? 'text-green-400' : 'text-gray-500';

                return `
                    <div class="p-3 bg-white/5 rounded-lg border border-white/10 hover:border-white/20 transition">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2">
                                <i data-lucide="${statusIcon}" class="w-4 h-4 ${statusColor}"></i>
                                <span class="font-medium text-sm">${model.name}</span>
                                ${isActive ? '<span class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded">Actif</span>' : ''}
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="pullModel('${model.name}')" class="p-1.5 hover:bg-blue-500/20 rounded text-blue-400 transition" title="Mettre à jour">
                                    <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteModel('${model.name}')" class="p-1.5 hover:bg-red-500/20 rounded text-red-400 transition" title="Supprimer">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span>Taille: ${size}</span>
                            <span>Dernière modif: ${model.modified_at ? new Date(model.modified_at).toLocaleDateString() : 'N/A'}</span>
                        </div>
                        ${model.digest ? `<div class="text-xs text-gray-600 mt-1 font-mono">${model.digest.substring(0, 12)}...</div>` : ''}
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Render agent models configuration
        function renderAgentModelsConfig() {
            const container = document.getElementById('agent-models-config');
            if (!container || !agents.length) return;

            const agentSettings = JSON.parse(localStorage.getItem('agentSettings') || '{}');

            container.innerHTML = agents.map(agent => {
                const currentModel = getAgentModel(agent.id) || agent.model || 'default';
                const timeout = agentSettings.timeouts?.[agent.id] || 120;
                const limit = agentSettings.limits?.[agent.id] || 2048;

                // Generate model options, fallback to default if no models loaded
                const modelOptions = models && models.length > 0 
                    ? models.map(m => `<option value="${m.name}" ${currentModel === m.name ? 'selected' : ''}>${m.name}</option>`).join('')
                    : `<option value="${currentModel}" selected>${currentModel}</option>`;

                return `
                    <div class="p-3 bg-white/5 rounded-lg">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-medium text-sm capitalize">${agent.name || agent.id}</span>
                            <span class="text-xs text-gray-500">${currentModel}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Génération</label>
                                <select onchange="setAgentModel('${agent.id}', 'generation', this.value)"
                                        class="agent-model-select w-full bg-[#252525] rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                        data-agent="${agent.id}">
                                    <option value="default">Par défaut</option>
                                    ${modelOptions}
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Raisonnement</label>
                                <select onchange="setAgentModel('${agent.id}', 'reasoning', this.value)"
                                        class="agent-model-select w-full bg-[#252525] rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                        data-agent="${agent.id}">
                                    <option value="default">Par défaut</option>
                                    ${modelOptions}
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Timeout (sec)</label>
                                <input type="number"
                                       value="${timeout}"
                                       min="10"
                                       max="600"
                                       class="timeout-input w-full bg-[#252525] rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                       data-agent="${agent.id}">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 block mb-1">Max tokens</label>
                                <input type="number"
                                       value="${limit}"
                                       min="128"
                                       max="8192"
                                       class="limit-input w-full bg-[#252525] rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                       data-agent="${agent.id}">
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Helper: read/write agent settings from localStorage
        function getAgentSettings() {
            const settings = JSON.parse(localStorage.getItem('agentSettings') || '{}');
            if (!settings.agentModels) settings.agentModels = {};
            if (!settings.timeouts) settings.timeouts = {};
            if (!settings.limits) settings.limits = {};
            return settings;
        }

        function saveAgentSettings(settings) {
            localStorage.setItem('agentSettings', JSON.stringify(settings));
        }

        function getCurrentAgentModel() {
            const agentSettings = getAgentSettings();
            return agentSettings.agentModels[currentAgent] || 'default';
        }

        // Get agent model
        function getAgentModel(agentId) {
            const agentSettings = getAgentSettings();
            return agentSettings.agentModels[agentId] || 'default';
        }

        // Set agent model for specific purpose
        function setAgentModel(agentId, purpose, modelName) {
            const settings = getAgentSettings();
            if (!settings.agentModels[agentId] || typeof settings.agentModels[agentId] === 'string') {
                settings.agentModels[agentId] = { generation: 'default', reasoning: 'default' };
            }
            settings.agentModels[agentId][purpose] = modelName;
            saveAgentSettings(settings);

            // Update UI if current agent
            if (agentId === currentAgent) {
                document.getElementById('current-agent-model').textContent = modelName;
            }
        }

        // Pull/update model
        async function pullModel(modelName) {
            if (!confirm(`Mettre à jour le modèle "${modelName}" ?`)) return;
            downloadModel(modelName);
        }

        // Check Ollama status
        async function checkOllamaStatus() {
            const statusEl = document.getElementById('ollama-status');
            try {
                const response = await fetch('http://localhost:11434/api/tags');
                if (response.ok) {
                    const data = await response.json();
                    const count = data.models?.length || 0;
                    statusEl.innerHTML = `
                        <span class="w-2 h-2 rounded-full bg-green-500"></span>
                        <span class="text-gray-400">Ollama: ${count} modèle(s)</span>
                    `;
                } else {
                    statusEl.innerHTML = `
                        <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        <span class="text-gray-400">Ollama: erreur</span>
                    `;
                }
            } catch (error) {
                statusEl.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-red-500"></span>
                    <span class="text-gray-400">Ollama: hors ligne</span>
                `;
            }
        }

        // Format bytes
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Show model selector
        function showModelSelector() {
            const container = document.getElementById('model-selector-list');
            container.innerHTML = models.map(model => `
                <button onclick="selectModel('${model.name}')" class="w-full p-3 bg-white/5 hover:bg-white/10 rounded-lg transition flex items-center justify-between">
                    <div>
                        <div class="font-medium">${model.name}</div>
                        <div class="text-xs text-gray-500">${formatBytes(model.size || 0)}</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                </button>
            `).join('');

            lucide.createIcons();
            openModal('modal-model-selector');
        }

        // Select model
        function selectModel(modelName) {
            document.getElementById('default-model-select').value = modelName;
            closeModal('modal-model-selector');
        }

        // Download model
        async function downloadModel(modelName) {
            document.getElementById('model-name-input').value = modelName;
            openModal('modal-download');
        }

        // Start download
        async function startDownload() {
            const modelName = document.getElementById('model-name-input').value.trim();
            if (!modelName) {
                alert('Entre un nom de modèle');
                return;
            }

            const progressDiv = document.getElementById('download-progress');
            const statusEl = document.getElementById('download-status');
            const percentEl = document.getElementById('download-percent');
            const barEl = document.getElementById('download-bar');
            const downloadBtn = document.getElementById('download-btn');

            progressDiv.classList.remove('hidden');
            downloadBtn.disabled = true;
            downloadBtn.textContent = 'Téléchargement...';

            try {
                const response = await fetch('http://localhost:11434/api/pull', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: modelName, stream: true })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(line => line.trim());

                    for (const line of lines) {
                        try {
                            const data = JSON.parse(line);
                            if (data.status) {
                                statusEl.textContent = data.status;
                            }
                            if (data.total && data.completed) {
                                const percent = Math.round((data.completed / data.total) * 100);
                                percentEl.textContent = `${percent}%`;
                                barEl.style.width = `${percent}%`;
                            }
                        } catch (e) {
                            // Ignore parse errors
                        }
                    }
                }

                statusEl.textContent = '✅ Téléchargement terminé!';
                percentEl.textContent = '100%';
                barEl.style.width = '100%';
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'Fermer';

                // Reload models
                setTimeout(() => {
                    loadModels();
                    closeModal('modal-download');
                }, 2000);

            } catch (error) {
                statusEl.textContent = '❌ Erreur: ' + error.message;
                downloadBtn.disabled = false;
                downloadBtn.textContent = 'Réessayer';
            }
        }

        // Delete model
        async function deleteModel(modelName) {
            if (!confirm(`Supprimer le modèle "${modelName}" ?`)) return;

            try {
                const response = await fetch('http://localhost:11434/api/delete', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: modelName })
                });

                if (response.ok) {
                    loadModels();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (error) {
                alert('Erreur: ' + error.message);
            }
        }

        // Load agents
        async function loadAgents() {
            try {
                const response = await fetch('/api/agents');
                agents = await response.json();
                renderAgentsList();
                renderAgentModelsConfig();

                if (agents.length > 0) {
                    selectAgent(agents[0].id);
                }
            } catch (error) {
                console.error('Error loading agents:', error);
            }
        }

        // Render agents list
        function renderAgentsList() {
            const container = document.getElementById('agents-list');
            const agentSettings = getAgentSettings();

            container.innerHTML = agents.map(agent => {
                const displayModel = agentSettings.agentModels[agent.id] || agent.model;
                return `
                    <button
                        onclick="selectAgent('${agent.id}')"
                        class="w-full p-3 rounded-lg transition flex items-center gap-3 ${
                            currentAgent === agent.id ? 'bg-indigo-500/20 border border-indigo-500/50' : 'bg-white/5 hover:bg-white/10'
                        }"
                        id="agent-${agent.id}"
                    >
                        <i data-lucide="${agentIcons[agent.id] || 'bot'}" class="w-5 h-5 text-${agentColors[agent.id] || 'gray'}-400"></i>
                        <div class="flex-1 text-left">
                            <div class="font-medium text-sm capitalize">${agent.name || agent.id}</div>
                            <div class="text-xs text-gray-500">${agent.description || ''}</div>
                        </div>
                        <div class="text-xs text-gray-400">${displayModel}</div>
                    </button>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Select agent
        function selectAgent(agentId) {
            currentAgent = agentId;
            renderAgentsList();
            document.getElementById('current-agent-name').textContent = agents.find(a => a.id === agentId)?.name || agentId;
            document.getElementById('current-agent-model').textContent = getCurrentAgentModel();
        }

        // WebSocket connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                isConnected = true;
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onclose = () => {
                isConnected = false;
                updateStatus(false);
                // Reconnect after 5 seconds
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Handle WebSocket messages
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'message':
                    addMessage(data.content, data.role);
                    break;
                case 'status':
                    updateStatus(data.connected);
                    break;
                case 'typing':
                    if (data.typing) {
                        showTypingIndicator();
                    } else {
                        hideTypingIndicator();
                    }
                    break;
            }
        }

        // Update connection status
        function updateStatus(connected) {
            const statusEl = document.getElementById('connection-status');
            if (connected) {
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> <span class="text-gray-400">Connecté</span>';
            } else {
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> <span class="text-gray-400">Déconnecté</span>';
            }
        }

        // Add message to chat
        function addMessage(content, role) {
            const messagesEl = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            if (role === 'user') {
                messageDiv.innerHTML = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center flex-shrink-0">
                            <i data-lucide="user" class="w-4 h-4 text-indigo-400"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-indigo-500/10 rounded-lg p-3">
                                <p class="text-sm">${content}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-gray-500/20 flex items-center justify-center flex-shrink-0">
                            <i data-lucide="${agentIcons[currentAgent] || 'bot'}" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-white/5 rounded-lg p-3">
                                <p class="text-sm whitespace-pre-wrap">${content}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            messagesEl.appendChild(messageDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            lucide.createIcons();
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messagesEl = document.getElementById('messages');
            let typingEl = document.getElementById('typing-indicator');

            if (!typingEl) {
                typingEl = document.createElement('div');
                typingEl.id = 'typing-indicator';
                typingEl.className = 'message assistant';
                typingEl.innerHTML = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 rounded-full bg-gray-500/20 flex items-center justify-center flex-shrink-0">
                            <i data-lucide="${agentIcons[currentAgent] || 'bot'}" class="w-4 h-4 text-gray-400"></i>
                        </div>
                        <div class="flex-1">
                            <div class="bg-white/5 rounded-lg p-3">
                                <div class="flex items-center gap-1">
                                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                messagesEl.appendChild(typingEl);
            }

            messagesEl.scrollTop = messagesEl.scrollTop;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const typingEl = document.getElementById('typing-indicator');
            if (typingEl) {
                typingEl.remove();
            }
        }

        // Handle form submission
        async function handleSubmit(event) {
            event.preventDefault();

            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            input.style.height = 'auto';

            isGenerating = true;
            document.getElementById('stop-btn').classList.remove('hidden');

            try {
                const payload = {
                    message: message,
                    model: getCurrentAgentModel()
                };
                console.debug('Sending chat request', payload);

                const response = await fetch(`/api/chat/${currentAgent}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                const output = data.output || data.response || 'Aucune réponse';
                addMessage(output, 'assistant');

            } catch (error) {
                addMessage('❌ Erreur: ' + error.message, 'assistant');
            } finally {
                isGenerating = false;
                document.getElementById('stop-btn').classList.add('hidden');
                hideTypingIndicator();
            }
        }

        // Stop generation (placeholder - needs backend support)
        function stopGeneration() {
            // TODO: Implement abort on backend
            hideTypingIndicator();
            isGenerating = false;
            document.getElementById('stop-btn').classList.add('hidden');
            addMessage('⏹️ Génération arrêtée', 'assistant');
        }

        // Modal functions
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Settings functions
        function openSettings() {
            switchTab('settings');
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-white z-50 ${
                type === 'success' ? 'bg-green-500' :
                type === 'error' ? 'bg-red-500' : 'bg-blue-500'
            }`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function saveSettings() {
            // Save global settings to localStorage
            const settings = {
                ollamaUrl: document.getElementById('ollama-url-input').value,
                defaultModel: document.getElementById('default-model-select').value,
                generationTimeout: parseInt(document.getElementById('generation-timeout').value),
                maxTokens: parseInt(document.getElementById('max-tokens').value),
                temperature: parseFloat(document.getElementById('temperature').value)
            };
            localStorage.setItem('localAgentsSettings', JSON.stringify(settings));

            // Save agent-specific settings
            const agentSettings = getAgentSettings();
            agentSettings.agentModels = {};
            agentSettings.timeouts = {};
            agentSettings.limits = {};

            // Collect agent model settings
            document.querySelectorAll('.agent-model-select').forEach(select => {
                const agentName = select.dataset.agent;
                agentSettings.agentModels[agentName] = select.value;
            });

            // Collect timeout settings
            document.querySelectorAll('.timeout-input').forEach(input => {
                const agentName = input.dataset.agent;
                agentSettings.timeouts[agentName] = parseInt(input.value);
            });

            // Collect limit settings
            document.querySelectorAll('.limit-input').forEach(input => {
                const agentName = input.dataset.agent;
                agentSettings.limits[agentName] = parseInt(input.value);
            });

            saveAgentSettings(agentSettings);

            // Refresh UI to reflect saved settings
            renderAgentsList();
            selectAgent(currentAgent);

            showToast('Settings saved successfully!', 'success');
        }

        // Update generation settings for current session
        function updateGenerationSettings(settings) {
            // Store in a way that can be accessed by the chat function
            window.generationSettings = settings;
        }

        // Load settings
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('localAgentsSettings') || '{}');

            if (settings.ollamaUrl) {
                document.getElementById('ollama-url-input').value = settings.ollamaUrl;
            }
            if (settings.defaultModel) {
                document.getElementById('default-model-select').value = settings.defaultModel;
            }
            if (settings.generationTimeout) {
                document.getElementById('generation-timeout').value = settings.generationTimeout;
            }
            if (settings.maxTokens) {
                document.getElementById('max-tokens').value = settings.maxTokens;
            }
            if (settings.temperature) {
                document.getElementById('temperature').value = settings.temperature;
            }

            updateGenerationSettings(settings);

            // Load agent-specific settings
            const agentSettings = JSON.parse(localStorage.getItem('agentSettings') || '{}');

            // Load agent model settings
            if (agentSettings.agentModels) {
                Object.entries(agentSettings.agentModels).forEach(([agentName, model]) => {
                    const select = document.querySelector(`.agent-model-select[data-agent="${agentName}"]`);
                    if (select) select.value = model;
                });
            }

            // Load timeout settings
            if (agentSettings.timeouts) {
                Object.entries(agentSettings.timeouts).forEach(([agentName, timeout]) => {
                    const input = document.querySelector(`.timeout-input[data-agent="${agentName}"]`);
                    if (input) input.value = timeout;
                });
            }

            // Load limit settings
            if (agentSettings.limits) {
                Object.entries(agentSettings.limits).forEach(([agentName, limit]) => {
                    const input = document.querySelector(`.limit-input[data-agent="${agentName}"]`);
                    if (input) input.value = limit;
                });
            }
        }
    </script>
</body>
</html>
